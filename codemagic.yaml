workflows:
  ios-capacitor-build:
    name: HD현대 식단 앱 - iOS Build & TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    # 💡 "app_store_connect_key" 는 Codemagic 콘솔 → Team settings → Integrations →
    # App Store Connect 에서 Key ID / Issuer ID / .p8 파일을 등록할 때 지정하는
    # "Reference name"과 정확히 같은 이름이어야 합니다. .p8 파일 자체는 여기(코드)에
    # 절대 넣지 말고 Codemagic 콘솔에서만 등록하세요.
    integrations:
      app_store_connect: app_store_connect_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.hhimeal.app
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
      node: latest
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Sync Capacitor iOS
        script: npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
